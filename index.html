<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍡 Kawaii Slice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Quicksand:wght@500;600&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(160deg, #B8EAD8 80%, #FFD6C0 100%);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #fps {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #5C3D4E;
      background: rgba(184, 234, 216, 0.82);
      border: 2px solid #7DD4B0;
      border-radius: 14px;
      padding: 5px 14px;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #5C3D4E;
      background: rgba(255, 214, 192, 0.88);
      border: 2px solid #FFB08A;
      border-radius: 20px;
      padding: 14px 28px;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.5s;
    }

    #hud-score {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Nunito', sans-serif;
      font-size: 30px;
      font-weight: 900;
      color: #FFB08A;
      text-shadow: 0 2px 10px rgba(92, 61, 78, 0.25);
      pointer-events: none;
      white-space: nowrap;
    }

    #hand-warning {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Quicksand', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: #5C3D4E;
      background: rgba(255, 176, 138, 0.92);
      border: 2px solid #FFB08A;
      border-radius: 20px;
      padding: 10px 22px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }
    #gameover-screen {
      position: fixed;
      inset: 0;
      background: rgba(184, 234, 216, 0.55);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #gameover-screen.visible { display: flex; }

    #gameover-card {
      background: rgba(255, 214, 192, 0.97);
      border: 3px solid #FFB08A;
      border-radius: 36px;
      padding: 48px 72px;
      text-align: center;
      color: #5C3D4E;
    }
    #gameover-card .go-emoji { font-size: 56px; line-height: 1; }
    #gameover-card h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 44px;
      font-weight: 900;
      margin: 12px 0 4px;
    }
    #gameover-card p {
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      margin-bottom: 4px;
    }
    #gameover-final-score {
      font-family: 'Nunito', sans-serif;
      font-size: 64px;
      font-weight: 900;
      color: #FFB08A;
      margin: 10px 0 28px;
    }
    #play-again-btn {
      font-family: 'Nunito', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #5C3D4E;
      background: #B8EAD8;
      border: 3px solid #7DD4B0;
      border-radius: 24px;
      padding: 14px 40px;
      cursor: pointer;
      transition: transform 0.12s, background 0.12s;
    }
    #play-again-btn:hover {
      background: #7DD4B0;
      transform: scale(1.06);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="fps">FPS: --</div>
  <div id="hud-score">🍡 0</div>
  <div id="status">🍡 Starting camera…</div>
  <div id="hand-warning">☝️ Point your index finger at the camera!</div>

  <div id="gameover-screen">
    <div id="gameover-card">
      <div class="go-emoji">💔</div>
      <h1>Game Over!</h1>
      <p>You scored</p>
      <div id="gameover-final-score">0</div>
      <button id="play-again-btn">Play Again 🍡</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script>
    const canvas       = document.getElementById('canvas');
    const ctx          = canvas.getContext('2d');
    const fpsEl        = document.getElementById('fps');
    const statusEl     = document.getElementById('status');
    const handWarningEl = document.getElementById('hand-warning');

    let lastHandTime = 0;
    let cameraReady  = false;

    let handResults = [];
    let lastFpsTime = performance.now();
    let frameCount  = 0;
    let fps = 0;

    const TRAIL_LENGTH = 12;
    const VELOCITY_THRESHOLD = 40;
    let trailPoints = [];
    let prevTip = null;
    let bladeActive = false;

    const GRAVITY = 0.45;
    const MAX_ITEMS = 6;
    const SPAWN_INTERVAL_START = 1800;
    const SPAWN_INTERVAL_MIN  = 600;

    const SLICEABLES = [
      { emoji: '🍡', points: 10 },
      { emoji: '🧋', points: 15 },
      { emoji: '🍩', points: 10 },
      { emoji: '🍰', points: 20 },
      { emoji: '🍓', points: 25 },
      { emoji: '🎂', points: 30 },
    ];

    const DANGER_ITEMS = [
      { emoji: '🍡', badge: '🖤', points: -20, danger: true },
      { emoji: '🧋', badge: '🤢', points: -20, danger: true },
      { emoji: '🍰', badge: '👿', points: -30, danger: true },
    ];

    let score     = 0;
    let gameState = 'playing'; // 'playing' | 'gameover'

    let items = [];
    let sliceParticles    = [];
    let confettiParticles = [];
    let dangerEffects     = [];
    let ambientSparkles   = [];
    let vignetteAlpha = 0;
    let vignetteTime  = 0;
    let lastSpawnTime = 0;
    let gameStartTime = 0;

    const CONFETTI_COLORS = ['#FFAFC5', '#7DD4B0', '#FFB08A', '#FFE566', '#C8A4FF'];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.muted = true;

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    hands.onResults(results => {
      handResults = results.multiHandLandmarks || [];
      if (handResults.length > 0) {
        lastHandTime = performance.now();
        if (statusEl.style.opacity !== '0') {
          statusEl.style.opacity = '0';
          setTimeout(() => { statusEl.style.display = 'none'; }, 500);
        }
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 1280,
      height: 720
    });

    camera.start().then(() => {
      statusEl.textContent = '🤙 Show your hand!';
      cameraReady  = true;
      lastHandTime = performance.now();
    }).catch(err => {
      statusEl.textContent = '⚠️ Camera access denied';
      console.error(err);
    });

    function drawFrame(now) {
      requestAnimationFrame(drawFrame);

      frameCount++;
      if (now - lastFpsTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastFpsTime = now;
        fpsEl.textContent = `FPS: ${fps}`;
      }

      handWarningEl.style.display =
        (cameraReady && now - lastHandTime > 1500) ? 'block' : 'none';

      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // Draw mirrored webcam feed to fill canvas (cover)
      if (video.readyState >= 2 && video.videoWidth > 0) {
        const vr = video.videoWidth / video.videoHeight;
        const cr = w / h;
        let dw, dh, dx, dy;
        if (vr > cr) {
          dh = h; dw = h * vr;
          dx = (w - dw) / 2; dy = 0;
        } else {
          dw = w; dh = w / vr;
          dx = 0; dy = (h - dh) / 2;
        }
        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, dx, dy, dw, dh);
        ctx.restore();
      } else {
        ctx.fillStyle = '#B8EAD8';
        ctx.fillRect(0, 0, w, h);
      }

      updateAndDrawAmbientSparkles(now);
      updateItems(now);
      drawItems(now);

      // Update blade trail from index fingertip (landmark 8)
      if (handResults.length > 0) {
        const lm = handResults[0][8];
        const tipX = (1 - lm.x) * w;
        const tipY = lm.y * h;

        // Only recompute velocity when MediaPipe delivers a new position.
        // rAF runs at 60 fps but MediaPipe updates at ~30 fps, so half the
        // frames have identical coordinates — those must not reset bladeActive.
        const posChanged = !prevTip ||
          Math.abs(tipX - prevTip.x) > 0.5 ||
          Math.abs(tipY - prevTip.y) > 0.5;

        if (posChanged) {
          const velocity = prevTip
            ? Math.hypot(tipX - prevTip.x, tipY - prevTip.y)
            : 0;
          bladeActive = velocity > VELOCITY_THRESHOLD;
          prevTip = { x: tipX, y: tipY };
        }

        if (bladeActive) {
          const last = trailPoints[trailPoints.length - 1];
          if (!last || last.x !== tipX || last.y !== tipY) {
            trailPoints.push({ x: tipX, y: tipY });
            if (trailPoints.length > TRAIL_LENGTH) trailPoints.shift();
          }
        } else if (trailPoints.length > 0) {
          trailPoints.shift();
        }
      } else {
        prevTip = null;
        bladeActive = false;
        if (trailPoints.length > 0) trailPoints.shift();
      }

      checkSlices();
      drawSliceParticles(now);
      updateAndDrawConfetti(now);
      updateAndDrawDangerEffects(now);
      drawTrail();

      // Blade emoji at fingertip — always visible when hand is tracked
      if (prevTip) {
        ctx.save();
        ctx.translate(prevTip.x, prevTip.y);
        if (bladeActive && trailPoints.length >= 2) {
          const a = trailPoints[trailPoints.length - 2];
          const b = trailPoints[trailPoints.length - 1];
          ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 4);
        }
        ctx.font         = '36px serif';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔪', 0, 0);
        ctx.restore();
      }

      drawVignette(now);
    }

    function spawnItem() {
      if (items.length >= MAX_ITEMS) return;
      const isDanger = Math.random() < 0.2;
      const pool     = isDanger ? DANGER_ITEMS : SLICEABLES;
      const template = pool[Math.floor(Math.random() * pool.length)];

      const w = canvas.width, h = canvas.height;
      let x, y, vx, vy;

      const edge = Math.random();

      if (edge < 0.22) {
        // ── Top edge: falls downward through centre ──
        x = w * (0.1 + Math.random() * 0.8);
        y = -60;
        const tgtX = w * (0.25 + Math.random() * 0.5);
        const tgtY = h * (0.45 + Math.random() * 0.25); // aim at 45–70 % height
        const dx = tgtX - x, dy = tgtY - y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = 7 + Math.random() * 4;
        vx = dx / dist * speed;
        vy = dy / dist * speed;

      } else {
        // ── Bottom / Left / Right: launch upward, apex at 20–50 % height ──
        const apexY = h * (0.20 + Math.random() * 0.30); // 20–50 %
        const apexX = w * (0.25 + Math.random() * 0.50); // 25–75 %

        if (edge < 0.52) {          // ~30 % — bottom
          x = w * (0.05 + Math.random() * 0.90);
          y = h + 60;
        } else if (edge < 0.76) {   // ~24 % — left
          x = -60;
          y = h * (0.55 + Math.random() * 0.35);
        } else {                    // ~24 % — right
          x = w + 60;
          y = h * (0.55 + Math.random() * 0.35);
        }

        const rise = y - apexY; // pixels the item must climb to reach apex
        vy = -Math.sqrt(2 * GRAVITY * Math.max(rise, 1));
        const t = -vy / GRAVITY;   // frames until apex
        vx = (apexX - x) / t;
      }

      items.push({
        emoji:  template.emoji,
        badge:  template.badge  || null,
        points: template.points,
        danger: template.danger || false,
        x, y, vx, vy,
        rotation:      0,
        rotationSpeed: (Math.random() - 0.5) * 0.05,
        size: 95,
        id: Math.random(),
      });
    }

    function updateItems(now) {
      if (gameState !== 'playing') return;
      if (gameStartTime === 0) gameStartTime = now;
      const elapsed  = now - gameStartTime;
      const interval = Math.max(
        SPAWN_INTERVAL_MIN,
        SPAWN_INTERVAL_START - Math.floor(elapsed / 30000) * 50
      );

      if (now - lastSpawnTime > interval) {
        spawnItem();
        lastSpawnTime = now;
      }

      for (const item of items) {
        item.vy += GRAVITY;
        item.x  += item.vx;
        item.y  += item.vy;
        item.rotation += item.rotationSpeed;

        if (item.danger) {
          item.vx += (Math.random() - 0.5) * 0.4;
          item.vx  = Math.max(-5, Math.min(5, item.vx));
        }
      }

      items = items.filter(item =>
        item.y < canvas.height + 100 &&
        item.x > -150 &&
        item.x < canvas.width + 150
      );
    }

    function drawItems(now) {
      for (const item of items) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rotation);

        if (item.danger) {
          const pulse     = 0.5 + 0.5 * Math.sin(now * 0.005);
          ctx.shadowColor = '#4A3057';
          ctx.shadowBlur  = 18 + 14 * pulse;
        }

        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';

        ctx.font = `${item.size}px serif`;
        ctx.fillText(item.emoji, 0, 0);

        if (item.badge) {
          const badgeSize = Math.round(item.size * 0.48);
          ctx.shadowBlur  = 0;
          ctx.font        = `${badgeSize}px serif`;
          ctx.fillText(item.badge, item.size * 0.28, -item.size * 0.28);
        }

        ctx.restore();
      }
    }

    function segmentIntersectsCircle(ax, ay, bx, by, cx, cy, r) {
      const dx = bx - ax, dy = by - ay;
      const fx = ax - cx, fy = ay - cy;
      const a  = dx*dx + dy*dy;
      if (a === 0) return (fx*fx + fy*fy) <= r*r;
      const b    = 2 * (fx*dx + fy*dy);
      const c    = fx*fx + fy*fy - r*r;
      const disc = b*b - 4*a*c;
      if (disc < 0) return false;
      const sq = Math.sqrt(disc);
      const t1 = (-b - sq) / (2*a);
      const t2 = (-b + sq) / (2*a);
      return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1);
    }

    function updateScoreDisplay() {
      document.getElementById('hud-score').textContent = `🍡 ${score}`;
    }

    function triggerGameOver() {
      gameState = 'gameover';
      items = [];
      trailPoints = [];
      prevTip    = null;
      bladeActive = false;
      setTimeout(() => {
        document.getElementById('gameover-final-score').textContent = score;
        document.getElementById('gameover-screen').classList.add('visible');
      }, 820);
    }

    document.getElementById('play-again-btn').addEventListener('click', () => {
      score     = 0;
      gameState = 'playing';
      items = []; sliceParticles = []; confettiParticles = []; dangerEffects = [];
      trailPoints = []; prevTip = null; bladeActive = false; vignetteAlpha = 0;
      lastSpawnTime = 0; gameStartTime = 0;
      updateScoreDisplay();
      document.getElementById('gameover-screen').classList.remove('visible');
    });

    function checkSlices() {
      if (gameState !== 'playing') return;
      if (!bladeActive || trailPoints.length < 2) return;

      const slicedIds = new Set();

      // Test every consecutive segment in the trail so fast swipes
      // that span multiple MediaPipe frames are never missed.
      for (let i = 1; i < trailPoints.length; i++) {
        const a = trailPoints[i - 1];
        const b = trailPoints[i];
        for (const item of items) {
          if (!slicedIds.has(item.id) &&
              segmentIntersectsCircle(a.x, a.y, b.x, b.y, item.x, item.y, item.size * 0.55)) {
            slicedIds.add(item.id);
          }
        }
      }

      if (!slicedIds.size) return;
      const lastA = trailPoints[trailPoints.length - 2];
      const lastB = trailPoints[trailPoints.length - 1];
      const hitItems = items.filter(i => slicedIds.has(i.id));
      for (const item of hitItems) sliceItem(item, lastA, lastB);
      items = items.filter(i => !slicedIds.has(i.id));
    }

    function sliceItem(item, ptA, ptB) {
      const svx = ptB.x - ptA.x;
      const svy = ptB.y - ptA.y;
      const len  = Math.sqrt(svx*svx + svy*svy) || 1;
      const sliceAngle = Math.atan2(svy, svx);

      // Perpendicular to blade = direction the two halves separate
      const nx = -svy / len;
      const ny =  svx / len;
      const push = 5;

      for (let side = 0; side < 2; side++) {
        const s = side === 0 ? 1 : -1;
        sliceParticles.push({
          emoji: item.emoji,
          x: item.x + nx * s * 5,
          y: item.y + ny * s * 5,
          vx: item.vx + nx * s * push,
          vy: item.vy + ny * s * push,
          rotation: item.rotation,
          rotationSpeed: item.rotationSpeed + s * 0.08,
          size: item.size,
          sliceAngle,
          side,
          born: performance.now(),
          life: 680,
        });
      }

      if (item.danger) {
        emitDangerEffect(item.x, item.y);
        triggerGameOver();
      } else {
        score += item.points;
        updateScoreDisplay();
        emitSliceBurst(item.x, item.y);
      }
    }

    function drawSliceParticles(now) {
      sliceParticles = sliceParticles.filter(s => now - s.born < s.life);

      for (const shard of sliceParticles) {
        shard.vy += GRAVITY;
        shard.x  += shard.vx;
        shard.y  += shard.vy;
        shard.rotation += shard.rotationSpeed;

        const age = (now - shard.born) / shard.life;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - age * 1.4);
        ctx.translate(shard.x, shard.y);

        // Clip to correct half along the slice line
        ctx.rotate(-shard.sliceAngle);
        ctx.beginPath();
        if (shard.side === 0) {
          ctx.rect(-300, -300, 600, 300); // "above" cut
        } else {
          ctx.rect(-300, 0,    600, 300); // "below" cut
        }
        ctx.clip();
        ctx.rotate(shard.sliceAngle);

        ctx.rotate(shard.rotation);
        ctx.font         = `${shard.size}px serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(shard.emoji, 0, 0);
        ctx.restore();
      }
    }

    function drawStarShape(innerRatio, size) {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI / 4) - Math.PI / 4;
        const r = (i % 2 === 0) ? size : size * innerRatio;
        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
        else         ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }
      ctx.closePath();
    }

    function initAmbientSparkles() {
      const count = 8 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        ambientSparkles.push({
          x:     Math.random() * canvas.width,
          y:     Math.random() * canvas.height,
          vx:    (Math.random() - 0.5) * 0.35,
          vy:    (Math.random() - 0.5) * 0.35,
          size:  4 + Math.random() * 4,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    function emitSliceBurst(x, y) {
      const count = 40 + Math.floor(Math.random() * 21);
      const shapes = ['circle', 'star4', 'sparkle'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        confettiParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          rotation:      Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.25,
          size:  4 + Math.random() * 8,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          born: performance.now(),
          life: 900,
        });
      }
    }

    function emitDangerEffect(x, y) {
      const puffCount = 8 + Math.floor(Math.random() * 5);
      for (let i = 0; i < puffCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 2.5;
        dangerEffects.push({
          type: 'smoke',
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.8,
          size: 10 + Math.random() * 15,
          born: performance.now(),
          life: 600,
        });
      }
      dangerEffects.push({
        type: 'emoji', x, y: y - 10,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -2.5,
        size: 38,
        born: performance.now(),
        life: 900,
      });
      vignetteAlpha = 0.7;
      vignetteTime  = performance.now();
    }

    function updateAndDrawAmbientSparkles(now) {
      const w = canvas.width, h = canvas.height;
      for (const s of ambientSparkles) {
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < -20)    s.x = w + 20;
        if (s.x > w + 20) s.x = -20;
        if (s.y < -20)    s.y = h + 20;
        if (s.y > h + 20) s.y = -20;

        const alpha = 0.3 + 0.2 * Math.sin(now * 0.002 + s.phase);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle   = '#C8A4FF';
        ctx.translate(s.x, s.y);
        drawStarShape(0.15, s.size);
        ctx.fill();
        ctx.restore();
      }
    }

    function updateAndDrawConfetti(now) {
      confettiParticles = confettiParticles.filter(p => now - p.born < p.life);
      for (const p of confettiParticles) {
        p.vy += 0.12;
        p.vx *= 0.99;
        p.x  += p.vx;
        p.y  += p.vy;
        p.rotation += p.rotationSpeed;

        const age   = (now - p.born) / p.life;
        const alpha = Math.max(0, 1 - age * age);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle   = p.color;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          drawStarShape(p.shape === 'sparkle' ? 0.12 : 0.42, p.size);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function updateAndDrawDangerEffects(now) {
      dangerEffects = dangerEffects.filter(e => now - e.born < e.life);
      for (const e of dangerEffects) {
        e.vy += 0.06;
        e.x  += e.vx;
        e.y  += e.vy;

        const age   = (now - e.born) / e.life;
        const alpha = Math.max(0, 1 - age);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(e.x, e.y);
        if (e.type === 'smoke') {
          ctx.beginPath();
          ctx.arc(0, 0, e.size * (0.6 + age * 0.8), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(74, 48, 87, 0.55)';
          ctx.fill();
        } else {
          ctx.font         = `${e.size}px serif`;
          ctx.textAlign    = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('😵', 0, 0);
        }
        ctx.restore();
      }
    }

    function drawVignette(now) {
      if (vignetteAlpha <= 0) return;
      vignetteAlpha = Math.max(0, 0.7 * (1 - (now - vignetteTime) / 400));
      const w = canvas.width, h = canvas.height;
      const grad = ctx.createRadialGradient(w/2, h/2, h*0.25, w/2, h/2, h*0.85);
      grad.addColorStop(0, 'rgba(220, 80, 120, 0)');
      grad.addColorStop(1, `rgba(220, 80, 120, ${vignetteAlpha * 0.6})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    function drawTrail() {
      const n = trailPoints.length;
      if (n < 2) return;

      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);       // 0 = oldest tail, 1 = newest tip
        const alpha  = t * 0.92;
        const radius = 3 + t * 9;    // 3 px at tail → 12 px at tip

        ctx.save();
        if (t > 0.65) {
          ctx.shadowColor = '#FFAFC5';
          ctx.shadowBlur  = 18 * t;
        }
        ctx.beginPath();
        ctx.arc(trailPoints[i].x, trailPoints[i].y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 175, 197, ${alpha})`;
        ctx.fill();
        ctx.restore();
      }
    }

    initAmbientSparkles();
    requestAnimationFrame(drawFrame);
  </script>
</body>
</html>
